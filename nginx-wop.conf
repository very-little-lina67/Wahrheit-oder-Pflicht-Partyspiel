# Nginx Konfiguration für Wahrheit oder Pflicht (WOP)
# Domain: www.wop.omoflow.de / wop.omoflow.de
# Ziel: Lokaler Node.js Prozess auf Port 3002

# HTTP Weiterleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.wop.omoflow.de wop.omoflow.de;

    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wop.omoflow.de wop.omoflow.de;

    # SSL Zertifikate (anpassen an Certbot-Pfade nach `certbot --nginx`)
    # ssl_certificate /etc/letsencrypt/live/www.wop.omoflow.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.wop.omoflow.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Performance & Kompression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 10M;

    # Static Files & SPA Proxy
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Upgrade für Socket.io
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Dauerhafte WebSocket-Verbindungen ohne vorzeitiges Timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
