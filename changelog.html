<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog – Wahrheit oder Pflicht Partyspiel</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card: rgba(0, 0, 0, 0.55);
            --text: #f0f4f8;
            --muted: #a8b4c4;
            --accent: #67e8f9;
            --primary: #c084fc;
            --warn: #f87171;
            --ok: #34d399;
            --border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            padding: 24px 16px 48px;
        }
        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 28px;
        }
        header h1 {
            margin: 0 0 8px;
            font-size: 1.55rem;
            color: var(--accent);
        }
        header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }
        .version-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(192, 132, 252, 0.18);
            color: var(--primary);
            border: 1px solid rgba(192, 132, 252, 0.4);
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .card h2 {
            margin: 0 0 10px;
            font-size: 1.15rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card h3 {
            margin: 14px 0 6px;
            font-size: 0.98rem;
            color: var(--accent);
        }
        .card p, .card li {
            font-size: 0.92rem;
            color: var(--text);
        }
        .card ul {
            margin: 6px 0 0;
            padding-left: 1.25rem;
        }
        .card li { margin-bottom: 6px; }
        .card strong { color: #e9d5ff; }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(103, 232, 249, 0.15);
            color: var(--accent);
            border: 1px solid rgba(103, 232, 249, 0.35);
            vertical-align: middle;
        }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-back:hover { text-decoration: underline; }
        footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted);
        }
        footer a {
            color: #00bfff;
            text-decoration: none;
            margin: 0 6px;
        }
        footer a:hover { text-decoration: underline; }
        footer .sep { color: #666; }
        #changelog-content pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            margin: 0;
            color: var(--text);
        }
        .loading {
            text-align: center;
            color: var(--muted);
            padding: 24px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="nav-back" href="index.html">← Zurück zum Spiel</a>

        <header>
            <h1>Changelog</h1>
            <p>Alle wesentlichen Änderungen am Projekt</p>
            <span class="version-badge">Aktuell: v2.0.10</span>
        </header>

        <div id="changelog-content">
            <div class="card loading">Changelog wird geladen …</div>
        </div>

        <footer>
            <a href="index.html">Spiel</a>
            <span class="sep">·</span>
            <a href="regelwerk.html">Regelwerk</a>
            <span class="sep">·</span>
            <a href="impressum.html">Impressum</a>
            <span class="sep">·</span>
            <a href="datenschutz.html">Datenschutz</a>
        </footer>
    </div>

    <script>
    (function () {
        var container = document.getElementById("changelog-content");

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function renderMarkdown(md) {
            var lines = md.replace(/\r\n/g, "\n").split("\n");
            var html = [];
            var inList = false;
            var inCard = false;

            function closeList() {
                if (inList) {
                    html.push("</ul>");
                    inList = false;
                }
            }
            function closeCard() {
                closeList();
                if (inCard) {
                    html.push("</div>");
                    inCard = false;
                }
            }

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                var trimmed = line.trim();

                if (trimmed === "---") {
                    closeCard();
                    continue;
                }

                // Version heading ## [x.y.z] - date
                var verMatch = trimmed.match(/^##\s+\[([^\]]+)\]\s*(.*)$/);
                if (verMatch) {
                    closeCard();
                    html.push('<div class="card">');
                    html.push('<h2><span class="badge">' + escapeHtml(verMatch[1]) + "</span> " + escapeHtml(verMatch[2].trim()) + "</h2>");
                    inCard = true;
                    continue;
                }

                // Skip top-level title
                if (trimmed.match(/^#\s+/)) continue;

                // ### New Features / Bug Fixes
                var h3 = trimmed.match(/^###\s+(.+)$/);
                if (h3) {
                    closeList();
                    if (!inCard) {
                        html.push('<div class="card">');
                        inCard = true;
                    }
                    html.push("<h3>" + escapeHtml(h3[1]) + "</h3>");
                    continue;
                }

                // Bullet
                var bullet = trimmed.match(/^-\s+(.+)$/);
                if (bullet) {
                    if (!inCard) {
                        html.push('<div class="card">');
                        inCard = true;
                    }
                    if (!inList) {
                        html.push("<ul>");
                        inList = true;
                    }
                    var item = bullet[1]
                        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                        .replace(/`([^`]+)`/g, "<code>$1</code>");
                    html.push("<li>" + item + "</li>");
                    continue;
                }

                // Sub-bullet (indented)
                var sub = line.match(/^\s{2,}-\s+(.+)$/);
                if (sub) {
                    if (!inList) {
                        html.push("<ul>");
                        inList = true;
                    }
                    var subItem = sub[1]
                        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                        .replace(/`([^`]+)`/g, "<code>$1</code>");
                    html.push("<li>" + subItem + "</li>");
                    continue;
                }

                // Empty line
                if (trimmed === "") {
                    closeList();
                    continue;
                }

                // Plain paragraph
                closeList();
                if (!inCard) {
                    html.push('<div class="card">');
                    inCard = true;
                }
                var para = trimmed
                    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                    .replace(/`([^`]+)`/g, "<code>$1</code>");
                html.push("<p>" + para + "</p>");
            }

            closeCard();
            return html.join("\n");
        }

        function showFallback() {
            container.innerHTML =
                '<div class="card">' +
                '<h2><span class="badge">2.0.10</span> 2026-11-05</h2>' +
                "<h3>New Features</h3>" +
                "<ul>" +
                "<li><strong>Changelog im Spiel-Footer</strong> – Link und Versionsnummer v2.0.10 im Legal-Footer sowie im Login-Modal.</li>" +
                "<li>Diese Seite zeigt den Inhalt von <code>docs/CHANGELOG.md</code>.</li>" +
                "</ul>" +
                "</div>" +
                '<div class="card"><p style="color:var(--muted);font-size:0.9rem;">Vollständiger Changelog konnte nicht geladen werden. Bitte <code>docs/CHANGELOG.md</code> prüfen.</p></div>';
        }

        // Versuche zuerst docs/CHANGELOG.md, dann CHANGELOG.md im Root
        var urls = ["docs/CHANGELOG.md", "CHANGELOG.md"];

        function tryFetch(idx) {
            if (idx >= urls.length) {
                showFallback();
                return;
            }
            fetch(urls[idx], { cache: "no-store" })
                .then(function (res) {
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.text();
                })
                .then(function (md) {
                    if (!md || md.length < 20) throw new Error("empty");
                    container.innerHTML = renderMarkdown(md);
                })
                .catch(function () {
                    tryFetch(idx + 1);
                });
        }

        tryFetch(0);
    })();
    </script>
</body>
</html>
