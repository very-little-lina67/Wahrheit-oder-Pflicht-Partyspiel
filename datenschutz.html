            line-height: 1.65;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 16px 48px;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            background: linear-gradient(160deg, #2eb8ff, #0099e0);
            color: #0a1520;
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 14px rgba(0, 153, 224, 0.25);
            transition: filter 150ms ease, transform 150ms ease;
        }
        .back:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-switch label {
            font-size: 13px;
            color: var(--muted);
        }
        .lang-switch select {
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(9, 14, 20, 0.9);
            color: var(--text);
            cursor: pointer;
        }
        .lang-switch select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel);
            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.32),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: clamp(18px, 4vw, 28px);
        }

        h1 {
            color: var(--gold);
            font-size: 1.55rem;
            margin: 0 0 0.35em;
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        h2 {
            color: var(--link);
            font-size: 1.08rem;
            margin: 1.55em 0 0.45em;
            letter-spacing: -0.015em;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);

            font-size: 1rem;
            margin: 1.15em 0 0.4em;

            color: #e4eaf0;

            margin: 0.5em 0 0.9em;

            margin: 0.35em 0;
            color: #e4eaf0;
        }

            color: var(--link);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;

            padding-top: 1em;
            border-top: 1px solid rgba(255, 255, 255, 0.08);

            .card { border-radius: 14px; padding: 16px; }

</head>

        function setPageLang(lang) {
            if (!texts[lang]) lang = "de";
            document.documentElement.lang = lang;
            document.title = texts[lang].title;
            document.getElementById("back-link").innerHTML = texts[lang].back;
            document.getElementById("content").innerHTML = texts[lang].html;
            document.getElementById("page-lang").value = lang;
            try {
                localStorage.setItem("lang", lang);
                localStorage.setItem("wop_lang", lang);
            } catch (e) {}
        }

        (function () {
            var lang = "de";
            try {
                var stored = localStorage.getItem("lang") || localStorage.getItem("wop_lang");
                if (stored === "en" || stored === "de") lang = stored;
                else if (navigator.language && navigator.language.toLowerCase().indexOf("en") === 0) lang = "en";
            } catch (e) {}
            setPageLang(lang);
        })();
