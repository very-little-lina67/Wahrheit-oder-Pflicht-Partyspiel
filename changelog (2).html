<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog – Wahrheit oder Pflicht Partyspiel</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card: rgba(0, 0, 0, 0.55);
            --text: #f0f4f8;
            --muted: #a8b4c4;
            --accent: #67e8f9;
            --primary: #c084fc;
            --warn: #f87171;
            --ok: #34d399;
            --border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            padding: 24px 16px 48px;
        }
        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 28px;
        }
        header h1 {
            margin: 0 0 8px;
            font-size: 1.55rem;
            color: var(--accent);
        }
        header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }
        .lang-switch {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .lang-switch button {
            appearance: none;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .lang-switch button.active {
            background: linear-gradient(145deg, #a78bfa, #7c3aed);
            border-color: rgba(221, 214, 254, 0.4);
        }
        .version-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(192, 132, 252, 0.18);
            color: var(--primary);
            border: 1px solid rgba(192, 132, 252, 0.4);
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .card h2 {
            margin: 0 0 10px;
            font-size: 1.15rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card h3 {
            margin: 14px 0 6px;
            font-size: 0.98rem;
            color: var(--accent);
        }
        .card p, .card li {
            font-size: 0.92rem;
            color: var(--text);
        }
        .card ul {
            margin: 6px 0 0;
            padding-left: 1.25rem;
        }
        .card li { margin-bottom: 6px; }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(103, 232, 249, 0.15);
            color: var(--accent);
            border: 1px solid rgba(103, 232, 249, 0.35);
            vertical-align: middle;
        }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-back:hover { text-decoration: underline; }
        footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted);
        }
        footer a {
            color: #00bfff;
            text-decoration: none;
            margin: 0 6px;
        }
        footer a:hover { text-decoration: underline; }
        footer .sep { color: #666; }
        .loading {
            text-align: center;
            color: var(--muted);
            padding: 24px;
        }
        .note {
            font-size: 0.85rem;
            color: var(--muted);
            border-left: 3px solid var(--primary);
            padding-left: 12px;
            margin: 0 0 14px;
        }
        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85em;
            background: rgba(255,255,255,0.08);
            padding: 1px 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="nav-back" id="nav-back" href="index.html">← Zurück zum Spiel</a>

        <header>
            <h1 id="page-title">Changelog</h1>
            <p id="page-subtitle">Alle wesentlichen Änderungen am Projekt</p>
            <span class="version-badge" id="version-badge">Aktuell: v2.0.11</span>
            <div class="lang-switch">
                <button type="button" id="btn-de" class="active" onclick="setChangelogLang('de')">🇩🇪 Deutsch</button>
                <button type="button" id="btn-en" onclick="setChangelogLang('en')">🇬🇧 English</button>
            </div>
        </header>

        <div id="changelog-content">
            <div class="card loading" id="loading-msg">Changelog wird geladen …</div>
        </div>

        <footer>
            <a href="index.html" id="ft-game">Spiel</a>
            <span class="sep">·</span>
            <a href="regelwerk.html" id="ft-rules">Regelwerk</a>
            <span class="sep">·</span>
            <a href="impressum.html" id="ft-imprint">Impressum</a>
            <span class="sep">·</span>
            <a href="datenschutz.html" id="ft-privacy">Datenschutz</a>
        </footer>
    </div>

    <script>
    (function () {
        var container = document.getElementById("changelog-content");
        var currentLang = "de";
        var cachedMd = null;

        var i18n = {
            de: {
                title: "Changelog",
                docTitle: "Changelog – Wahrheit oder Pflicht Partyspiel",
                subtitle: "Alle wesentlichen Änderungen am Projekt",
                badge: "Aktuell: v2.0.11",
                back: "← Zurück zum Spiel",
                loading: "Changelog wird geladen …",
                game: "Spiel",
                rules: "Regelwerk",
                imprint: "Impressum",
                privacy: "Datenschutz",
                fallbackTitle: "Vollständiger Changelog konnte nicht geladen werden.",
                fallbackHint: "Bitte docs/CHANGELOG.md prüfen.",
                enNote: null
            },
            en: {
                title: "Changelog",
                docTitle: "Changelog – Truth or Dare Party Game",
                subtitle: "All notable changes to this project",
                badge: "Current: v2.0.11",
                back: "← Back to game",
                loading: "Loading changelog …",
                game: "Game",
                rules: "Rules",
                imprint: "Legal notice",
                privacy: "Privacy",
                fallbackTitle: "Could not load the full changelog.",
                fallbackHint: "Please check docs/CHANGELOG.md.",
                enNote: "The technical changelog below is written in German. Section headings (New Features, Bug Fixes, UX) are in English."
            }
        };

        var enSummary210 = ''
            + '<div class="card">'
            + '<h2><span class="badge">2.0.11</span> 2026-11-05</h2>'
            + '<h3>New Features</h3>'
            + '<ul>'
            + '<li><strong>Language switch (Deutsch / English)</strong> on the changelog page, matching Rules and Legal notice. UI strings are fully translated; preference is stored in localStorage.</li>'
            + '</ul>'
            + '</div>'
            + '<div class="card">'
            + '<h2><span class="badge">2.0.10</span> 2026-11-05</h2>'
            + '<h3>New Features</h3>'
            + '<ul>'
            + '<li><strong>Version link in the game footer</strong> (<code>index.html</code>, <code>changelog.html</code>): '
            + 'Next to Rules · Legal notice · Privacy the clickable version number <strong>2.0.10</strong> is shown. '
            + 'Tapping it opens this page, which displays <code>docs/CHANGELOG.md</code> in the same glassmorphism / dark theme as the other legal pages. '
            + 'The same version link is also available on the login / register modal before signing in. '
            + 'Cache-busting query parameters were raised to 2.0.10.</li>'
            + '</ul>'
            + '<h3>UX</h3>'
            + '<ul>'
            + '<li><strong>Removed redundant Changelog self-link</strong> on this page: the footer no longer includes a “Changelog” entry while you are already here. '
            + 'Footer on this page: Game · Rules · Legal notice · Privacy.</li>'
            + '<li><strong>Language switch</strong> (Deutsch / English) on the changelog page, matching Rules and Legal notice.</li>'
            + '</ul>'
            + '</div>';

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function applyChrome(lang) {
            var t = i18n[lang] || i18n.de;
            document.documentElement.lang = lang;
            document.title = t.docTitle;
            document.getElementById("page-title").textContent = t.title;
            document.getElementById("page-subtitle").textContent = t.subtitle;
            document.getElementById("version-badge").textContent = t.badge;
            document.getElementById("nav-back").textContent = t.back;
            document.getElementById("ft-game").textContent = t.game;
            document.getElementById("ft-rules").textContent = t.rules;
            document.getElementById("ft-imprint").textContent = t.imprint;
            document.getElementById("ft-privacy").textContent = t.privacy;
            document.getElementById("btn-de").classList.toggle("active", lang === "de");
            document.getElementById("btn-en").classList.toggle("active", lang === "en");
        }

        function renderMarkdown(md) {
            var lines = md.replace(/\r\n/g, "\n").split("\n");
            var html = [];
            var inList = false;
            var inCard = false;

            function closeList() {
                if (inList) {
                    html.push("</ul>");
                    inList = false;
                }
            }
            function closeCard() {
                closeList();
                if (inCard) {
                    html.push("</div>");
                    inCard = false;
                }
            }

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                var trimmed = line.trim();

                if (trimmed === "---") {
                    closeCard();
                    continue;
                }

                var verMatch = trimmed.match(/^##\s+\[([^\]]+)\]\s*(.*)$/);
                if (verMatch) {
                    closeCard();
                    html.push('<div class="card">');
                    html.push('<h2><span class="badge">' + escapeHtml(verMatch[1]) + "</span> " + escapeHtml(verMatch[2].trim()) + "</h2>");
                    inCard = true;
                    continue;
                }

                if (trimmed.match(/^#\s+/)) continue;

                var h3 = trimmed.match(/^###\s+(.+)$/);
                if (h3) {
                    closeList();
                    if (!inCard) {
                        html.push('<div class="card">');
                        inCard = true;
                    }
                    html.push("<h3>" + escapeHtml(h3[1]) + "</h3>");
                    continue;
                }

                var bullet = trimmed.match(/^-\s+(.+)$/);
                if (bullet) {
                    if (!inCard) {
                        html.push('<div class="card">');
                        inCard = true;
                    }
                    if (!inList) {
                        html.push("<ul>");
                        inList = true;
                    }
                    var item = bullet[1]
                        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                        .replace(/`([^`]+)`/g, "<code>$1</code>");
                    html.push("<li>" + item + "</li>");
                    continue;
                }

                var subBullet = line.match(/^\s{2,}-\s+(.+)$/);
                if (subBullet) {
                    if (!inList) {
                        if (!inCard) {
                            html.push('<div class="card">');
                            inCard = true;
                        }
                        html.push("<ul>");
                        inList = true;
                    }
                    var subItem = subBullet[1]
                        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                        .replace(/`([^`]+)`/g, "<code>$1</code>");
                    html.push("<li>" + subItem + "</li>");
                    continue;
                }

                if (trimmed === "") {
                    closeList();
                    continue;
                }

                closeList();
                if (!inCard) {
                    html.push('<div class="card">');
                    inCard = true;
                }
                var para = trimmed
                    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                    .replace(/`([^`]+)`/g, "<code>$1</code>");
                html.push("<p>" + para + "</p>");
            }

            closeCard();
            return html.join("\n");
        }

        function showFallback() {
            var t = i18n[currentLang] || i18n.de;
            var body = currentLang === "en"
                ? enSummary210
                : ('<div class="card">'
                    + '<h2><span class="badge">2.0.10</span> 2026-11-05</h2>'
                    + "<h3>New Features</h3><ul>"
                    + "<li><strong>Versions-Link im Spiel-Footer</strong> – klickbare Versionsnummer 2.0.10 im Legal-Footer und im Login-Modal.</li>"
                    + "<li>Diese Seite zeigt den Inhalt von <code>docs/CHANGELOG.md</code>.</li>"
                    + "</ul></div>");
            container.innerHTML = body
                + '<div class="card"><p style="color:var(--muted);font-size:0.9rem;">'
                + escapeHtml(t.fallbackTitle) + " " + escapeHtml(t.fallbackHint)
                + "</p></div>";
        }

        function paintContent() {
            if (!cachedMd) {
                showFallback();
                return;
            }
            var t = i18n[currentLang] || i18n.de;
            var prefix = "";
            if (currentLang === "en") {
                prefix = enSummary210
                    + (t.enNote ? '<p class="note">' + escapeHtml(t.enNote) + "</p>" : "")
                    + '<div class="card"><h2>Full technical history</h2></div>';
            }
            container.innerHTML = prefix + renderMarkdown(cachedMd);
        }

        function tryFetch(urls, idx) {
            if (idx >= urls.length) {
                showFallback();
                return;
            }
            fetch(urls[idx], { cache: "no-store" })
                .then(function (res) {
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.text();
                })
                .then(function (md) {
                    if (!md || md.length < 20) throw new Error("empty");
                    cachedMd = md;
                    paintContent();
                })
                .catch(function () {
                    tryFetch(urls, idx + 1);
                });
        }

        window.setChangelogLang = function (lang) {
            currentLang = lang === "en" ? "en" : "de";
            try { localStorage.setItem("wop_changelog_lang", currentLang); } catch (e) {}
            applyChrome(currentLang);
            if (cachedMd) {
                paintContent();
            } else {
                container.innerHTML = '<div class="card loading">' + escapeHtml(i18n[currentLang].loading) + "</div>";
            }
        };

        var pref = null;
        try { pref = localStorage.getItem("wop_changelog_lang"); } catch (e) {}
        if (!pref) {
            try {
                var appLang = localStorage.getItem("wop_lang") || localStorage.getItem("lang");
                if (appLang === "en") pref = "en";
            } catch (e2) {}
        }
        if (!pref && typeof navigator !== "undefined" && navigator.language && navigator.language.toLowerCase().indexOf("en") === 0) {
            pref = "en";
        }
        currentLang = pref === "en" ? "en" : "de";
        applyChrome(currentLang);
        container.innerHTML = '<div class="card loading">' + escapeHtml(i18n[currentLang].loading) + "</div>";
        tryFetch(["docs/CHANGELOG.md", "CHANGELOG.md"], 0);
    })();
    </script>
</body>
</html>
