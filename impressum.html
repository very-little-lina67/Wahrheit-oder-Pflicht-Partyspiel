<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressum - Wahrheit oder Pflicht Partyspiel</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: rgba(18, 25, 34, 0.88);
            --border: rgba(190, 210, 226, 0.14);
            --text: #f4f7fa;
            --muted: #aab7c4;
            --accent: #62dfc4;
            --accent-warm: #ff795e;
            --gold: #ffcc00;
            --link: #62d8ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 8% 0%, rgba(255, 121, 94, 0.12), transparent 34%),
                radial-gradient(ellipse at 94% 10%, rgba(98, 223, 196, 0.10), transparent 32%),
                var(--bg);
            background-attachment: fixed;
            line-height: 1.65;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 16px 48px;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            background: linear-gradient(160deg, #2eb8ff, #0099e0);
            color: #0a1520;
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 14px rgba(0, 153, 224, 0.25);
            transition: filter 150ms ease, transform 150ms ease;
        }
        .back:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-switch label {
            font-size: 13px;
            color: var(--muted);
        }
        .lang-switch select {
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(9, 14, 20, 0.9);
            color: var(--text);
            cursor: pointer;
        }
        .lang-switch select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel);
            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.32),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: clamp(18px, 4vw, 28px);
        }

        h1 {
            color: var(--gold);
            font-size: 1.55rem;
            margin: 0 0 0.4em;
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        h2 {
            color: var(--link);
            font-size: 1.08rem;
            margin: 1.55em 0 0.45em;
            letter-spacing: -0.015em;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        p {
            margin: 0.55em 0;
            color: #e4eaf0;
        }

        a {
            color: var(--link);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }
        a:hover { color: #9ae8ff; }

        strong { color: var(--gold); }

        .footer-links {
            margin-top: 2.2em;
            padding-top: 1em;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
        }

        @media (max-width: 520px) {
            .page { padding: 14px 12px 36px; }
            .card { border-radius: 14px; padding: 16px; }
            h1 { font-size: 1.35rem; }
            .top-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="top-bar">
            <a class="back" id="back-link" href="index.html">&larr; Zur&uuml;ck zum Spiel</a>
            <div class="lang-switch">
                <label for="page-lang">Language:</label>
                <select id="page-lang" onchange="setPageLang(this.value)">
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="en">🇬🇧 English</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div id="content"></div>
        </div>
    </div>

    <script>

            de: {
                title: "Impressum - Wahrheit oder Pflicht Partyspiel",
                back: "&larr; Zur&uuml;ck zum Spiel",
                html: [

                    "<h2>Verantwortlich f&uuml;r den Inhalt nach &sect; 55 Abs. 2 RStV</h2>",
                    "<p>Lina Ulrich<br></p>",
                    "<h2>Haftungsausschluss</h2>",
                    "<p>Die Inhalte dieser Website wurden mit gr&ouml;&szlig;ter Sorgfalt erstellt. F&uuml;r die Richtigkeit, Vollst&auml;ndigkeit und Aktualit&auml;t der Inhalte k&ouml;nnen wir jedoch keine Gew&auml;hr &uuml;bernehmen. Als Diensteanbieterin sind wir f&uuml;r eigene Inhalte auf diesen Seiten nach den allgemeinen Gesetzen verantwortlich. Wir sind nicht verpflichtet, &uuml;bermittelte oder gespeicherte fremde Informationen zu &uuml;berwachen oder nach Umst&auml;nden zu forschen, die auf eine rechtswidrige T&auml;tigkeit hinweisen.</p>",
                    "<h2>Haftung f&uuml;r Links</h2>",
                    "<p>Unser Angebot enth&auml;lt ggf. Links zu externen Websites Dritter, auf deren Inhalte wir keinen Einfluss haben. Deshalb k&ouml;nnen wir f&uuml;r diese fremden Inhalte auch keine Gew&auml;hr &uuml;bernehmen. F&uuml;r die Inhalte der verlinkten Seiten ist stets der jeweilige Anbieter oder Betreiber der Seiten verantwortlich.</p>",
                    "<h2>Urheberrecht</h2>",
                    "<p>Die durch die Seitenbetreiberin erstellten Inhalte und Werke auf diesen Seiten unterliegen dem Urheberrecht. Die Vervielf&auml;ltigung, Bearbeitung, Verbreitung und jede Art der Verwertung au&szlig;erhalb der Grenzen des Urheberrechts bed&uuml;rfen der schriftlichen Zustimmung der jeweiligen Autorin bzw. Erstellerin.</p>",
                    "<p class=\"footer-links\"><a href=\"datenschutz.html\">&rarr; Datenschutzerkl&auml;rung</a> &middot; <a href=\"index.html\">Zum Spiel</a></p>"
                ].join("")
            },
            en: {
                title: "Legal Notice - Truth or Dare Party Game",
                back: "&larr; Back to the Game",
                html: [
                    "<h1>Legal Notice / Imprint</h1>",
                    "<h2>Information according to &sect; 5 TMG</h2>",
                    "<p><strong>Lina Ulrich</strong><br>",
                    "<h2>Contact</h2>",
                    "<p>Email: <a href=\"mailto:lu2239934@gmail.com\">lu2239934@gmail.com</a></p>",
                    "<h2>Responsible for Content according to &sect; 55 Abs. 2 RStV</h2>",
                    "<p>Lina Ulrich<br></p>",
                    "<h2>Disclaimer</h2>",
                    "<p>The content of this website has been created with the greatest care. However, we cannot guarantee the accuracy, completeness or timeliness of the content. As a service provider, we are responsible for our own content on these pages in accordance with general laws. We are not obliged to monitor transmitted or stored third-party information or to investigate circumstances that indicate illegal activity.</p>",

                    "<p>The content and works created by the site operator on these pages are subject to copyright. Reproduction, editing, distribution and any kind of exploitation outside the limits of copyright require the written consent of the respective author or creator.</p>",
                    "<p class=\"footer-links\"><a href=\"datenschutz.html\">&rarr; Privacy Policy</a> &middot; <a href=\"index.html\">To the Game</a></p>"
                ].join("")
            }
        };

        function setPageLang(lang) {
            if (!texts[lang]) lang = "de";
            document.documentElement.lang = lang;
            document.title = texts[lang].title;
            document.getElementById("back-link").innerHTML = texts[lang].back;
            document.getElementById("content").innerHTML = texts[lang].html;
            document.getElementById("page-lang").value = lang;
            try {
                localStorage.setItem("lang", lang);
                localStorage.setItem("wop_lang", lang);
            } catch (e) {}
        }

        (function () {
            var lang = "de";
            try {
                var stored = localStorage.getItem("lang") || localStorage.getItem("wop_lang");
                if (stored === "en" || stored === "de") lang = stored;
                else if (navigator.language && navigator.language.toLowerCase().indexOf("en") === 0) lang = "en";
            } catch (e) {}
            setPageLang(lang);
        })();
    </script>
</body>
</html>
